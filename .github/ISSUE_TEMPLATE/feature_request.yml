name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        开源版**不包含**：远程 Bot 开关、社区黑名单同步、快递站暗号协作等需联网或共享玩家数据的特性。此类建议通常不会合并，见 README「开源版不包含」。

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 你遇到了什么痛点？现有能力哪里不够用？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你设想的行为或 UI 变化（可简略）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 考虑过哪些替代做法？

  - type: dropdown
    id: scope
    attributes:
      label: 主要影响层
      options:
        - interaction（窗口/OCR/点击）
        - parsing（日志解析）
        - analysis（画板/估价）
        - pricing（出价策略）
        - ui（界面）
        - config / data（配置或静态表）
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: scope_check
    attributes:
      label: 范围确认
      options:
        - label: 本建议不涉及远程运营、共享黑名单或需上传玩家数据的功能
          required: true
